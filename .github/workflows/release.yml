name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "2.*"

permissions:
  contents: write

jobs:
  macos:
    name: build-sign-macos
    runs-on: macos-15
    # `secrets` cannot be referenced in step-level `if:`, but it is available in
    # `env:` — hoist the presence checks here and gate steps on `env.`.
    env:
      HAS_SIGNING: ${{ secrets.MACOS_P12_BASE64 != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_API_KEY_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache llama.cpp dylib
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/deno-llama
          key: llama-dylib-${{ hashFiles('packages/core/generated/meta.ts') }}

      - name: Build release artifacts (compile + bundle + assemble)
        run: deno run -A scripts/macos.ts release

      - name: Import signing certificate
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          MACOS_P12_BASE64: ${{ secrets.MACOS_P12_BASE64 }}
          MACOS_P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          echo "$MACOS_P12_BASE64" | base64 --decode > "$CERT_PATH"
          KEYCHAIN=$RUNNER_TEMP/build.keychain-db
          security create-keychain -p "" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$MACOS_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN"
          SIGN_TARGETS=(dist/deno-llama-cli/bin/deno-llama)
          for f in dist/deno-llama-cli/lib/*.dylib; do SIGN_TARGETS+=("$f"); done
          SIGN_TARGETS+=(dist/DenoLlama.app)
          deno run -A scripts/macos.ts sign "${SIGN_TARGETS[@]}"
          cd dist
          ditto -c -k --sequesterRsrc --keepParent deno-llama-cli deno-llama-cli-aarch64.zip
          ditto -c -k --sequesterRsrc --keepParent DenoLlama.app DenoLlama.app.zip

      - name: Notarize
        if: ${{ env.HAS_NOTARY == 'true' }}
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          KEY=$RUNNER_TEMP/AuthKey.p8
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$KEY"
          export APPLE_API_KEY_PATH=$KEY
          deno run -A scripts/macos.ts notarize dist/deno-llama-cli-aarch64.zip
          deno run -A scripts/macos.ts notarize dist/DenoLlama.app   # submits + staples
          # Re-zip the stapled app for distribution.
          cd dist && ditto -c -k --sequesterRsrc --keepParent DenoLlama.app DenoLlama.app.zip

      - name: Checksums
        # Run last so SHA256SUMS reflects the final signed/notarized artifacts.
        run: |
          cd dist
          shasum -a 256 deno-llama-cli-aarch64.zip DenoLlama.app.zip > SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deno-llama-macos-arm64
          path: |
            dist/deno-llama-cli-aarch64.zip
            dist/DenoLlama.app.zip
            dist/SHA256SUMS
            dist/build-metadata.json

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/deno-llama-cli-aarch64.zip
            dist/DenoLlama.app.zip
            dist/SHA256SUMS
            dist/build-metadata.json
          generate_release_notes: true
        # NOTE: intentionally no `deno publish` step — packages stay unpublished.
