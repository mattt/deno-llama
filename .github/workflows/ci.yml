name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (macos-15 arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # First `ensureLibrary()` downloads the pinned llama.cpp dylib (~11MB).
      # Cache it keyed on the pinned tag so unit tests don't refetch each run.
      - name: Cache llama.cpp dylib
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/deno-llama
          key: llama-dylib-${{ hashFiles('packages/core/generated/meta.ts') }}

      - name: Show versions
        run: deno --version

      - name: Format
        run: deno fmt --check

      - name: Lint
        run: deno lint

      # Type-check everything, including codegen/ and scripts/ which the test,
      # publish, and lint steps don't otherwise cover.
      - name: Type-check
        run: |
          deno check packages/core/mod.ts packages/llama/mod.ts
          deno check packages/core/codegen/generate.ts packages/core/codegen/typemap.ts
          deno check scripts/macos.ts scripts/bench.ts
          deno check examples/cli/main.ts examples/chat.ts examples/judge.ts examples/desktop/main.ts

      - name: Unit tests
        run: deno test -P=llama --allow-run

      - name: Publish dry-run
        run: deno publish --dry-run --allow-dirty

  integration:
    name: integration (models)
    runs-on: macos-15
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      DENO_LLAMA_TEST_MODEL: Qwen/Qwen2.5-0.5B-Instruct-GGUF
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache llama.cpp dylib
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/deno-llama
          key: llama-dylib-${{ hashFiles('packages/core/generated/meta.ts') }}

      - name: Cache HF models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-qwen2.5-0.5b-v1

      - name: Full tests (model-backed)
        run: deno test -P=llama --allow-run
